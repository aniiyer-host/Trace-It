[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[workspace.dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
# Pin compatibility suite for solana-program 1.18 + anchor 0.29 + rust 2021 edition
js-sys = "=0.3.67"
wasm-bindgen = "=0.2.90"
zeroize_derive = "=1.4.2"
proc-macro-crate = "=3.1.0"
toml_edit = "=0.21.1"
serde = "=1.0.210"
serde_derive = "=1.0.210"
bitflags = "=2.6.0"
borsh = "=1.5.1"
borsh-derive = "=1.5.1"
bytemuck_derive = "=1.8.0"
blake3 = "=1.5.5"
cpufeatures = "=0.2.17"


[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1