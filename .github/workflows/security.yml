name: DevSecOps Security

on:
  push:
    branches: [Aniket-Cyber]
  pull_request:
    branches: [Aniket-Cyber]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high || true

      - name: Generate SBOM
        run: |
          npx @cyclonedx/cyclonedx-npm \
            --output-file ../sbom-backend.json \
            --output-format json

      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: traceit-backend-sbom
          path: sbom-backend.json
      
      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep --version
          semgrep scan --config p/default --json --output semgrep-results.json .

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        with:
          name: traceit-semgrep-results
          path: semgrep-results.json